[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "deck-dash"
dynamic = ["version"]
description = "A 15-key Stream Deck as an ambient information display"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "streamdeck>=0.10.0",
  "pillow>=12.0",
  "numpy>=2.0",
  "psutil>=7.0",
  "nvidia-ml-py>=13.0",
  "feedparser>=6.0",
  "requests>=2.32",
  "pystray>=0.19",
]

[project.optional-dependencies]
dev = ["pytest>=9.0"]

# `deckdash` (console) and `deckdashw` (no console; the scheduled task runs this one) both call
# deckdash.main:main. Install editable from the main checkout: `pip install -e .`; config.toml,
# logs/ and state/ are found relative to the package, so the checkout stays the app's home.
[project.scripts]
deckdash = "deckdash.main:main"

[project.gui-scripts]
deckdashw = "deckdash.main:main"

[tool.setuptools]
packages = ["deckdash", "deckdash.ambient", "deckdash.sources", "deckdash.tiles"]

[tool.setuptools.dynamic]
version = {attr = "deckdash.__version__"}
